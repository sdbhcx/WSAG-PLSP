work_dir: &work_dir logs/seen
deterministic: False

data_dir: /mnt/sdb/wyn/data/AGD20K

load:
  encoder_ckpt: /mnt/sdb/wyn/model/ViT-B-16.pt
  all_ckpt: # leave blank for training

batch_size: 10 # real batch size = batch_size * accum_iter
img_size: 224
split_type: Seen
num_exo: 1
PL_mode: refined
aug4imgRatio: 0.5

optimizer:
  lr: 0.00005
  lr_encoder_coeff: 0.1
  betas:
    - 0.9
    - 0.95
  wd: 0.01

  max_iter: 5000000
  lr_step:  5000000
  lr_gamma: 0.1
  num_epochs: 40
  accum_iter: 2
  sche_type: cos

model:
  encoder_type: CLIP
  encoder_params:
    width: 768
    layers: 12
    heads: 12
    output_dim: 512
  decoder_embed_dim: 512

  pred_model_type: SAM
  pred_decoder_args:
    mlp_dim: 2048
    depth: 2
    use_up: 2
    use_additional_token: True
    conv_first: True

  use_prompt_learning: True
  prompt_length: 16
  prompt_dropout: 0.1
  prompt_num_heads: 8

  margin: 0.1

loss:
  kl_loss_coeff: 0.2
  sim_loss_coeff: 1.
  exo_cls_coeff: 0.8
  noun_sim_coeff: 0.1
  part_sim_coeff: 0.01
  proto_loss_coeff: 0.3
  conc_loss_coeff: 0.05
